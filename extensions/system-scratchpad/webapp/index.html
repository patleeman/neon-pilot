<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scratchpad</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <main class="scratchpad">
      <header class="toolbar">
        <div class="title">
          <p>Scratchpad</p>
          <span id="meta">Loading...</span>
        </div>
        <div class="actions">
          <button id="refresh" type="button">Refresh</button>
          <button id="revert" type="button" disabled>Revert</button>
          <button id="clear" type="button" disabled>Clear</button>
        </div>
      </header>
      <div id="notice" class="notice" hidden></div>
      <textarea id="editor" spellcheck="false" aria-label="Conversation scratchpad"></textarea>
      <footer class="footer">
        <span id="count">0 chars</span>
        <span id="conversation"></span>
      </footer>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
