<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/neon-pilot-favicon.svg" />
    <title>Neon Pilot</title>
    <!-- fonts bundled via @fontsource-variable/dm-sans + @fontsource/jetbrains-mono -->
    <!-- Inline loading indicator — replaced by React once it hydrates.
         The dark background + spinner give immediate visual feedback while
         the CSS/JS bundles load from disk.                                   -->
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: center;
        background: #0c0c08;
        color: rgba(255, 255, 255, 0.62);
        font:
          12px/1.4 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        z-index: 9999;
      }
      #app-loader::after {
        content: '';
        width: 22px;
        height: 22px;
        border: 2px solid rgba(255, 255, 255, 0.08);
        border-top-color: rgba(255, 255, 255, 0.5);
        border-radius: 50%;
        animation: neon-pilot-spin 0.8s linear infinite;
      }
      @keyframes neon-pilot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body style="margin: 0">
    <div id="root">
      <div id="app-loader"><span>Loading Neon Pilot…</span></div>
    </div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
